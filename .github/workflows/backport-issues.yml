name: Backports
# This workflow generates "backport" issues when a release branch label is added to an issue
on:
  issues:
    types: [labeled] # triggered when any label is added to an issue
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Tracking Issue Number'
        required: true
        type: string
      release_label:
        description: 'Release branch label (e.g. release/v15)'
        required: true
        type: string
      pr_number:
        description: 'Pull Request Number'
        required: false
        type: string

env:
  TERRAFORM_MAINTAINERS: ${{ vars.TERRAFORM_MAINTAINERS }}

permissions: {}

jobs:
  create-issue:
    name: 'Create Backport Issue'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.label.name, 'release/v') && !github.event.issue.pull_request)
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - name: Find and Verify PR Number
        id: extract-pr
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' && context.payload.inputs?.pr_number) {
              const rawPrInput = String(context.payload.inputs.pr_number).trim();
              if (rawPrInput !== '') {
                const cleanedPr = rawPrInput.replace(/^#/, '');
                if (/^[1-9]\d*$/.test(cleanedPr)) {
                  return parseInt(cleanedPr, 10);
                }
                core.setFailed(`Invalid pr_number input provided: ${context.payload.inputs.pr_number}`);
                return;
              }
            }

            const rawInputIssue = context.payload?.inputs?.issue_number ? String(context.payload.inputs.issue_number).trim().replace(/^#/, '') : undefined;
            const rawIssueNumber = context.payload?.issue?.number !== undefined ? String(context.payload.issue.number) : rawInputIssue;
            if (!rawIssueNumber || !/^[1-9]\d*$/.test(rawIssueNumber)) {
              core.setFailed('Could not determine valid issue number from event payload or workflow inputs.');
              return;
            }
            const issueNumber = parseInt(rawIssueNumber, 10);

            let comments = [];
            try {
              comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
            } catch (error) {
              core.setFailed(`Could not retrieve comments for issue #${issueNumber}: ${error.message}`);
              return;
            }

            const trackingRegex = /<!--\s*tracking-pr:\s*#?(\d+)\s*-->/i;
            for (let i = comments.length - 1; i >= 0; i--) {
              const comment = comments[i];
              const match = comment?.user?.login === 'github-actions[bot]' ? comment.body?.match(trackingRegex) : null;
              if (match) {
                return parseInt(match[1], 10);
              }
            }

            core.setFailed('No tracking PR comment found on issue.');
      - name: Create GitHub Issue
        id: create-github-issue
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TERRAFORM_MAINTAINERS: ${{ env.TERRAFORM_MAINTAINERS }}
          PR: ${{ steps.extract-pr.outputs.result }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          SCRIPT_MODE: backport-issues
        with:
          script: |
            // Checking out the repository is a security risk, so we instead fetch the script content directly
            // This allows us to validate the script in code reviews before merging
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/workflows/scripts/backports.js",
              // 'context.sha' is the SHA of the last commit on the default branch for this trigger
              ref: context.sha,
            });
            const scriptContent = Buffer.from(response.data.content, "base64").toString();

            // Write the script to a temporary file and require it to avoid eval()
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const tempPath = path.join(process.env.RUNNER_TEMP, 'backports.mjs');
            fs.writeFileSync(tempPath, scriptContent, 'utf8');
            const { default: script } = await import(pathToFileURL(tempPath).href);
            await script({github, context, core, process, getOctokit});
