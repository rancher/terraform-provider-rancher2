name: 'Manually Cherry-Pick to Release Branches'

on:
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: 'The sha of the merge commit from the main PR.'
        required: true

env:
  TERRAFORM_MAINTAINERS: ${{ vars.TERRAFORM_MAINTAINERS }} # eg. ["matttrach"]

permissions: {}

jobs:
  create-cherry-pick-prs:
    name: 'Create Cherry-Pick PRs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write
      actions: write
    steps:
      - name: 'Checkout Repository'
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: 'main'
          persist-credentials: false

      - name: 'Wait for merge to settle'
        id: wait-for-merge-settle
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          TERRAFORM_MAINTAINERS: ${{ env.TERRAFORM_MAINTAINERS }}
          SCRIPT_MODE: wait-for-settle
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/backports.js`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process});

      - name: Get Merge Token
        id: get-merge-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: contents: write, metadata: read, pull_requests: write, workflows: write
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN

      - name: 'Find Issues and Create Cherry-Pick PRs'
        id: find-issues-create-prs
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          TERRAFORM_MAINTAINERS: ${{ env.TERRAFORM_MAINTAINERS }}
          GITHUB_MERGE_TOKEN: ${{ env.GITHUB_MERGE_TOKEN }}
          SCRIPT_MODE: backport-pr
        with:
          script: |
            // getOctokit is provided globally by actions/github-script; an explicit require is not needed
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/backports.js`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process, getOctokit});
