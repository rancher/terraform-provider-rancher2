name: "Release Please"

on:
  push:
    branches:
      - "release/v*"
  workflow_call:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions: {}

jobs:
  release-please-release:
    name: "Release Please (Release Only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release-please-release.outputs.version }}
      tag_name: ${{ steps.release-please-release.outputs.tag_name }}
      release_created: ${{ steps.release-please-release.outputs.release_created }}
    steps:
      - name: "Release Please (Release Only)"
        id: release-please-release
        # https://github.com/googleapis/release-please-action/releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  release:
    name: "Generate Full Release"
    needs:
      - release-please-release
    if: needs.release-please-release.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    # https://github.com/rancher/terraform-provider-rancher2/blob/main/.github/workflows/release.yml
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please-release.outputs.tag_name || needs.release-please-release.outputs.version }}
    secrets: inherit

  release-please-pr:
    name: "Release Please (PR Only)"
    needs:
      - release-please-release
      - release
    if: |
      !cancelled() &&
      needs.release-please-release.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      prs_created: ${{ steps.release-please-pr.outputs.prs_created }}
      pr: ${{ steps.release-please-pr.outputs.pr }}
    steps:
      - name: "Get Merge Token"
        id: get-merge-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: contents: write, metadata: read, pull_requests: write, workflows: write
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN
      - name: "Release Please (PR Only)"
        id: release-please-pr
        # https://github.com/googleapis/release-please-action/releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ env.GITHUB_MERGE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  sync-manifest-pr:
    name: "Sync Release Please Manifest (PR)"
    needs:
      - release-please-release
      - release
    if: |
      !cancelled() &&
      needs.release-please-release.outputs.release_created == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sync-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: "Get Merge Token"
        id: get-merge-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: contents: write, metadata: read, pull_requests: write, workflows: write
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN
      - name: "Checkout Repository"
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ env.GITHUB_MERGE_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: "Run Manifest Sync Script"
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.release-please-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please-release.outputs.version }}
        with:
          github-token: ${{ env.GITHUB_MERGE_TOKEN }}
          script: |
            const script = await import('${{ github.workspace }}/.github/workflows/scripts/sync-manifest.js');
            await script.default({ github, context, core, process });
