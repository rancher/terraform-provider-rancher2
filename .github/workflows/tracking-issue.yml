name: TrackingIssue
# This workflow generates a "tracking" issue when a PR is found targeting main and isn't already tracked.
on:
  workflow_run:
    workflows: ["Validate PR Description"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR number to adopt and track (optional)'
        required: false

env:
  TERRAFORM_MAINTAINERS: ${{ vars.TERRAFORM_MAINTAINERS }}

permissions: {}

concurrency:
  group: tracking-issue-adoption
  cancel-in-progress: false

jobs:
  generate-issue:
    name: 'Create Tracking Issue'
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # To create issues and add labels
      pull-requests: read # To read PRs
      contents: read # To checkout the repo and get branch names
      id-token: write # Required for Vault OIDC authentication
      actions: write # To dispatch backport-issues workflow
    steps:
      - name: Checkout Code
        id: checkout-code
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: 'main'
      - name: Read Vault Secrets
        id: read-vault-secrets
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN
      - name: Create Tracking Issue
        id: create-tracking-issue
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TERRAFORM_MAINTAINERS: ${{ env.TERRAFORM_MAINTAINERS }}
          GITHUB_MERGE_TOKEN: ${{ env.GITHUB_MERGE_TOKEN }}
          SCRIPT_MODE: tracking-issue
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/releases.js`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process, getOctokit});
