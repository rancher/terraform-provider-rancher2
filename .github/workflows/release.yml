name: 'Release'

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to create (e.g. v1.2.3 or v1.2.3-rc.1)'
        required: true
        type: string
      branch:
        description: 'The branch where the sha exists (Required for RC releases, optional for stable releases)'
        required: false
        type: string
      sha:
        description: 'The commit SHA to create the tag from, defaults to HEAD of the selected branch'
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: 'Generate Release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    environment: release
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - name: 'Checkout Repository'
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: 'main'

      - name: 'Check Author'
        id: check-user-in-maintainers
        if: github.event_name == 'workflow_dispatch' && !contains(inputs.tag, 'rc')
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTAINERS: ${{ vars.TERRAFORM_MAINTAINERS }}
          SCRIPT_MODE: check-maintainer
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/releases.js`;
            const { default: script } = await import(scriptPath);
            const isMaintainer = await script({github, context, core, process});
            if (!isMaintainer) {
              core.setFailed(`User ${context.actor} is not authorized to trigger this workflow.`);
            }

      - name: 'Verify Tag'
        id: verify-tag
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "$TAG" == v* ]]; then
            echo "Tag must start with 'v' (e.g. v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          if grep -iq "rc" <<< "$TAG"; then
            if [ -z "$BRANCH" ]; then
              echo "Error: 'branch' input is required for RC releases."
              exit 1
            fi
            CLEAN_BRANCH="${BRANCH#refs/heads/}"
            CLEAN_BRANCH="${CLEAN_BRANCH#origin/}"
            if [[ ! "$CLEAN_BRANCH" =~ ^release/v[0-9]+ ]]; then
              echo "Error: RC releases must target a 'release/v<major>' branch (got '$BRANCH')."
              exit 1
            fi
          fi

      - name: 'Create and Push Tag with Git'
        id: create-push-tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          TARGET_BRANCH="${BRANCH#refs/heads/}"
          TARGET_BRANCH="${TARGET_BRANCH#origin/}"
          TARGET_BRANCH="${TARGET_BRANCH%/}"
          TARGET_BRANCH="${TARGET_BRANCH//[[:space:]]/}"
          if [ -n "$TARGET_BRANCH" ]; then
            if ! git fetch origin "$TARGET_BRANCH"; then
              echo "Error: Failed to fetch origin/$TARGET_BRANCH. Branch does not exist or fetch failed." >&2
              exit 1
            fi
          fi
          CLEAN_SHA="${SHA//[[:space:]]/}"
          if [ -n "$CLEAN_SHA" ]; then
            if ! git cat-file -e "${CLEAN_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "$CLEAN_SHA" 2>/dev/null || true
            fi
            TARGET_SHA=$(git rev-parse --verify "${CLEAN_SHA}^{commit}" 2>/dev/null || git rev-parse --verify "origin/${CLEAN_SHA}^{commit}" 2>/dev/null || true)
          elif [ -n "$TARGET_BRANCH" ]; then
            TARGET_SHA=$(git rev-parse --verify "origin/${TARGET_BRANCH}^{commit}" 2>/dev/null || true)
          else
            TARGET_SHA="${DEFAULT_SHA//[[:space:]]/}"
            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "$TARGET_SHA" 2>/dev/null || git fetch origin "$REF_NAME" 2>/dev/null || true
            fi
            TARGET_SHA=$(git rev-parse --verify "${TARGET_SHA}^{commit}" 2>/dev/null || git rev-parse --verify "origin/${TARGET_SHA}^{commit}" 2>/dev/null || true)
          fi
          if [ -z "$TARGET_SHA" ]; then
            echo "Error: Could not resolve target commit for tag $TAG." >&2
            exit 1
          fi

          # Check if tag already exists on remote origin
          EXISTING_REMOTE_TAG_REF=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" 2>/dev/null | awk '{print $1}')
          if [ -z "$EXISTING_REMOTE_TAG_REF" ]; then
            EXISTING_REMOTE_TAG_REF=$(git ls-remote --tags origin "refs/tags/${TAG}" 2>/dev/null | awk '{print $1}')
          fi

          if [ -n "$EXISTING_REMOTE_TAG_REF" ]; then
            if [ "$EXISTING_REMOTE_TAG_REF" != "$TARGET_SHA" ]; then
              echo "Error: Tag '$TAG' already exists on remote pointing to $EXISTING_REMOTE_TAG_REF, which does not match requested target SHA $TARGET_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already exists on remote origin pointing to matching target SHA $TARGET_SHA. Proceeding with idempotent release."
          else
            git tag "$TAG" -m "Release $TAG" "$TARGET_SHA"
            git push origin "$TAG"
          fi

      - name: 'Check out new tag into a new directory'
        id: checkout-new-tag
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          path: tags/${{ inputs.tag }}

      - name: 'Prepare Registry Manifest'
        id: prepare-registry-manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # remove any tags that are not the one specified (to avoid goreleaser confusion)
          DIR="$(pwd)"
          cd "$GITHUB_WORKSPACE/tags/$TAG"
          tags_to_delete=$(git tag | grep -v -x -F -e "$TAG" || true)
          if [ -n "$tags_to_delete" ]; then
            echo "$tags_to_delete" | xargs git tag -d
          fi
          # check for terraform-registry-manifest.json presence and create if missing
          if [ ! -f "terraform-registry-manifest.json" ]; then
            echo "terraform-registry-manifest.json not found, creating a default one."
            printf '{\n    "version": 1,\n    "metadata": {\n        "protocol_versions": ["4.0", "5.0", "6.0"]\n    }\n}\n' > terraform-registry-manifest.json
          fi
          cd "$DIR"

      - name: 'Retrieve GPG Credentials'
        id: retrieve-gpg-credentials
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/signing/gpg passphrase | GPG_PASSPHRASE ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKeyId | GPG_KEY_ID ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKey | GPG_KEY

      - name: 'Run GoReleaser'
        id: run-goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
          GPG_KEY: ${{ env.GPG_KEY }}
          TAG: ${{ inputs.tag }}
          # Relative to the repository root, which is where nix-run.sh starts. Avoids
          # having to name the workspace, whose path differs inside the container.
          WORKING_DIR: tags/${{ inputs.tag }}
          GORELEASER_CONFIG: ${{ contains(inputs.tag, 'rc') && '../../.goreleaser_rc.yml' || '../../.goreleaser.yml' }}
          SKIP_VALIDATE: 'true'
        # The key must be imported by the same 'suse' user that nix-run.sh drops to,
        # so goreleaser.sh does the import itself rather than a separate step as root.
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/goreleaser.sh

      - name: 'Publish Stable Release'
        id: publish-release
        if: "!contains(inputs.tag, 'rc')"
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ inputs.tag }}
          SCRIPT_MODE: publish-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/releases.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });

      - name: 'Find Issues and Create Comments'
        id: find-issues-create-comments
        if: "contains(inputs.tag, 'rc')"
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.branch }}
          SCRIPT_MODE: rc-notify
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/releases.js`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process});
