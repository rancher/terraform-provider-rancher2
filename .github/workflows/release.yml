name: Release Please

on:
  push:
    branches:
      - 'release/v*'

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      actions: read
    uses: rancher/terraform-provider-rancher2/.github/workflows/release-please.yml@main
    secrets: inherit
