name: release
on:
  push:
    branches:
      - release/v*

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions: {}

jobs:
  release-please-release:
    name: Release Please (Release Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release-please-release.outputs.version }}
      tag_name: ${{ steps.release-please-release.outputs.tag_name }}
      release_created: ${{ steps.release-please-release.outputs.release_created }}
    steps:
      - name: Release Please (Release Only)
        id: release-please-release
        # https://github.com/googleapis/release-please-action/releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  release:
    name: Generate Full Release
    needs:
      - release-please-release
    if: always() && needs.release-please-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        id: checkout-code
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: 'Checkout Workflow Scripts and GoReleaser Config from main'
        id: checkout-scripts-main
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch origin main:refs/remotes/origin/main || git fetch origin main
          git checkout origin/main -- .github/workflows/scripts .goreleaser.yml terraform-registry-manifest.json 2>/dev/null || git checkout FETCH_HEAD -- .github/workflows/scripts .goreleaser.yml terraform-registry-manifest.json
      - name: 'Clear out GitHub Runner'
        id: clear-runner
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: clear-runner
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/e2e.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });
      - name: Retrieve GPG Credentials
        id: retrieve-gpg-credentials
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/signing/gpg passphrase | GPG_PASSPHRASE ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKeyId | GPG_KEY_ID ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKey | GPG_KEY
      - name: Run GoReleaser
        id: run-goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
          GPG_KEY: ${{ env.GPG_KEY }}
          GORELEASER_CONFIG: .goreleaser.yml
          SKIP_VALIDATE: 'true'
        # The key must be imported by the same 'suse' user that nix-run.sh drops to,
        # so goreleaser.sh does the import itself rather than a separate step as root.
        run: |-
          .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/goreleaser.sh
      - name: Publish Release
        id: publish-release
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.release-please-release.outputs.tag_name || needs.release-please-release.outputs.version }}
          SCRIPT_MODE: publish-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/releases.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });

  release-please-pr:
    name: Release Please (PR Only)
    needs:
      - release-please-release
      - release
    if: |
      !cancelled() &&
      needs.release-please-release.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      prs_created: ${{ steps.release-please-pr.outputs.prs_created }}
      pr: ${{ steps.release-please-pr.outputs.pr }}
    steps:
      - name: Get Merge Token
        id: get-merge-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: contents: write, metadata: read, pull_requests: write, workflows: write
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN
      - name: Release Please (PR Only)
        id: release-please-pr
        # https://github.com/googleapis/release-please-action/releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ env.GITHUB_MERGE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
