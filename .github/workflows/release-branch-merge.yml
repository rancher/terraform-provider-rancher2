name: Release Branch Merge

on:
  workflow_run:
    workflows: ["Release", "Release Please"]
    types: [completed]
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch to process (e.g. release/v15)"
        required: true
        type: string
      sha:
        description: "Commit SHA to process (optional)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.branch || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  label:
    name: "Label Related Issue"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: "main"
          persist-credentials: false

      - name: "Get Issues Token"
        id: get-issues-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: issues: write, project: write
          secrets: |
            github/token/rancher--terraform-provider-rancher2--issues--write token | GITHUB_ISSUES_TOKEN

      - name: "Find and Label Related Issue"
        id: find-label-issue
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_ISSUES_TOKEN: ${{ env.GITHUB_ISSUES_TOKEN }}
          SCRIPT_MODE: merge-label
          SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch }}
        with:
          github-token: ${{ env.GITHUB_ISSUES_TOKEN }}
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/backports.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process, getOctokit: typeof getOctokit === 'function' ? getOctokit : undefined });
