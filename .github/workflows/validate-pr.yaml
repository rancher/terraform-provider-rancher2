name: Validate PR Description

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-description:
    name: 'Validate PR Description'
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot' && !startsWith(github.head_ref, 'release-please') && !github.event.pull_request.draft
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check PR Description
        id: check-pr-description
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/validate-pr-description.js`;
            const { default: validate } = await import(scriptPath);
            await validate({ github, context, core });

      - name: Save PR Signal
        id: save-pr-signal
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p signal
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_repo "$HEAD_REPO" \
            --arg head_branch "$HEAD_BRANCH" \
            '{
              pr_number: ($pr_number | tonumber),
              head_sha: $head_sha,
              head_repo: $head_repo,
              head_branch: $head_branch
            }' > signal/pr-signal.json

      - name: Upload PR Signal Artifact
        id: upload-pr-signal
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validate-pr-signal
          path: signal/pr-signal.json
          retention-days: 1

