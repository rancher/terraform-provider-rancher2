name: Auto Merge
# This privileged workflow processes qualifying review approvals to safely approve and enable auto-merge.

on:
  workflow_run:
    workflows: ["Auto Merge Listener"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 'Preflight Auto Merge Validation'
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      eligible: ${{ steps.validate-preflight.outputs.eligible }}
      pr_number: ${{ steps.validate-preflight.outputs.pr_number }}
      pr_head_sha: ${{ steps.validate-preflight.outputs.pr_head_sha }}
      review_id: ${{ steps.validate-preflight.outputs.review_id }}
      review_user: ${{ steps.validate-preflight.outputs.review_user }}
      review_commit_id: ${{ steps.validate-preflight.outputs.review_commit_id }}
    steps:
      - name: 'Checkout Repository'
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 'main'
          persist-credentials: false

      - name: 'Download Approval Signal'
        id: download-signal
        # https://github.com/actions/download-artifact/releases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: auto-merge-approval-signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: signal

      - name: 'Validate Auto Merge Preflight'
        id: validate-preflight
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: preflight
          APPROVAL_SIGNAL_PATH: signal/approval-signal.json
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/auto-merge.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });

  auto-merge:
    name: 'Process Auto Merge'
    needs: preflight
    if: github.event.workflow_run.conclusion == 'success' && needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      actions: read
    steps:
      - name: 'Checkout Repository'
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: 'main'
          persist-credentials: false

      - name: 'Download Approval Signal'
        id: download-signal
        # https://github.com/actions/download-artifact/releases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: auto-merge-approval-signal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: signal

      - name: 'Get Merge Token'
        id: get-merge-token
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          # Token permissions: pull_requests: write, metadata: read
          secrets: |
            github/token/rancher--terraform-provider-rancher2--pull_requests--write token | GITHUB_MERGE_TOKEN

      - name: 'Execute Auto Merge'
        id: execute-auto-merge
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: execute
          GITHUB_MERGE_TOKEN: ${{ env.GITHUB_MERGE_TOKEN }}
          APPROVAL_SIGNAL_PATH: signal/approval-signal.json
          TRIGGER_REVIEW_ID: ${{ needs.preflight.outputs.review_id }}
          TRIGGER_REVIEW_USER: ${{ needs.preflight.outputs.review_user }}
          TRIGGER_REVIEW_COMMIT_ID: ${{ needs.preflight.outputs.review_commit_id }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ needs.preflight.outputs.pr_head_sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            // getOctokit is provided globally by actions/github-script; an explicit require is not needed
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/auto-merge.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process, getOctokit });
