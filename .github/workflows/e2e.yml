name: "E2E Tests"

on:
  pull_request:
    branches:
      - "release/v*"
    types: [opened, synchronize, reopened]
  workflow_call:

env:
  AWS_REGION: us-west-2
  AWS_ROLE: arn:aws:iam::270074865685:role/terraform-module-ci-test
  ALL_TESTS_JSON: '["TestOneBasic","TestThreeBasic","TestProductionBasic"]'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && contains(fromJSON('["eio-github-actions-power-enhancer[bot]", "app/eio-github-actions-power-enhancer"]'), github.event.pull_request.user.login) && (startsWith(github.event.pull_request.head.ref, 'backport-') || startsWith(github.event.pull_request.head.ref, 'release-please--branches--')))
    name: "Filter Qualifying PRs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check-qualification.outputs.should_run }}
      sha: ${{ steps.check-qualification.outputs.sha }}
      is_fork: ${{ steps.check-qualification.outputs.is_fork }}
    steps:
      - name: "Checkout Repository"
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: "main"
          sparse-checkout: .github/workflows/scripts
      - name: "Check PR Qualification"
        id: check-qualification
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: filter-pr
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/e2e.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });

  setup:
    name: "Setup Matrix"
    needs:
      - filter
    if: |
      !cancelled() &&
      needs.filter.result == 'success' &&
      needs.filter.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tests: ${{ steps.set-matrix.outputs.tests }}
    steps:
      - name: "Set Matrix Output"
        id: set-matrix
        env:
          TEST_LIST: ${{ env.ALL_TESTS_JSON }}
        run: |
          echo "tests=$TEST_LIST" >> "$GITHUB_OUTPUT"

  test:
    name: "Run E2E Tests"
    needs:
      - filter
      - setup
    if: |
      !cancelled() &&
      needs.filter.result == 'success' &&
      needs.filter.outputs.should_run == 'true' &&
      needs.filter.outputs.sha != '' &&
      needs.setup.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        test_name: ${{ fromJSON(needs.setup.outputs.tests) }}
    steps:
      - name: "Checkout Code"
        id: checkout-code
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.filter.outputs.sha }}
      - name: "Checkout Test Suite and Scripts from main"
        id: checkout-main-tools
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: "main"
          path: .main-tools
          sparse-checkout: |
            .github/workflows/scripts
            examples
            test
            run_tests.sh
            cleanup.sh
          sparse-checkout-cone-mode: false
      - name: "Sync Test Suite from main"
        id: sync-test-suite
        run: |
          rm -rf examples test .github/workflows/scripts
          mkdir -p .github/workflows
          cp -r .main-tools/.github/workflows/scripts .github/workflows/
          cp -r .main-tools/examples .
          cp -r .main-tools/test .
          cp .main-tools/run_tests.sh .
          cp .main-tools/cleanup.sh .
          rm -rf .main-tools
      - name: "Clear out GitHub Runner"
        id: clear-runner
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: clear-runner
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/e2e.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });
      - name: "Run Unit Tests"
        id: run-unit-tests
        run: .github/workflows/scripts/nix-run.sh make test
      - name: "Configure AWS Credentials"
        id: aws-creds
        # https://github.com/aws-actions/configure-aws-credentials/releases
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: ${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          output-credentials: true
      - name: "Run E2E Tests"
        id: run-e2e-tests
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          IDENTIFIER: ${{ github.run_id }}-${{ matrix.test_name }}
          ZONE: ${{ secrets.ZONE }}
          TEST_NAME: ${{ matrix.test_name }}
        run: |
          if [ -z "$TEST_NAME" ]; then
            echo "Error: TEST_NAME environment variable is empty." >&2
            exit 1
          fi
          .github/workflows/scripts/nix-run.sh bash -c "
            export AWS_MAX_ATTEMPTS=\"100\"
            export AWS_RETRY_MODE=\"adaptive\"
            export ACME_SERVER_URL=\"https://acme-v02.api.letsencrypt.org/directory\"
            export RANCHER_INSECURE=\"false\"
            ./run_tests.sh -t \"\$TEST_NAME\" -d -a 3
          "

  cleanup:
    name: "Cleanup AWS Resources"
    needs:
      - filter
      - test
    if: |
      always() &&
      needs.filter.result == 'success' &&
      needs.filter.outputs.should_run == 'true' &&
      needs.filter.outputs.sha != ''
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout Code"
        id: checkout-code
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: "main"
      - name: "Clear out GitHub Runner"
        id: clear-runner
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: clear-runner
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/e2e.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });
      - name: "Configure AWS Credentials"
        id: aws-creds
        # https://github.com/aws-actions/configure-aws-credentials/releases
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: ${{ github.run_id }}-cleanup
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          output-credentials: true
      - name: "Cleanup AWS Resources"
        id: cleanup-aws
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
          IDENTIFIER: ${{ github.run_id }}
        run: |
          if [ -z "$IDENTIFIER" ]; then
            echo "Error: IDENTIFIER environment variable is empty." >&2
            exit 1
          fi
          .github/workflows/scripts/nix-run.sh bash -c "
            export AWS_MAX_ATTEMPTS=\"100\"
            export AWS_RETRY_MODE=\"adaptive\"
            ./run_tests.sh -c \"\$IDENTIFIER\"
          "

  e2e-status:
    name: "E2E Test Status Gate"
    needs:
      - filter
      - setup
      - test
      - cleanup
    if: always() && needs.filter.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: "main"
          sparse-checkout: .github/workflows/scripts
      - name: "Evaluate E2E Status"
        id: evaluate-status
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCRIPT_MODE: e2e-status
          FILTER_RESULT: ${{ needs.filter.result }}
          SETUP_RESULT: ${{ needs.setup.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          TEST_RESULT: ${{ needs.test.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          SHA: ${{ needs.filter.outputs.sha }}
          IS_FORK: ${{ needs.filter.outputs.is_fork }}
          SKIP_COMMIT_STATUS: "true"
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/e2e.js`;
            const { default: script } = await import(scriptPath);
            await script({ github, context, core, process });
