name: Pull Request

# This workflow runs both for PRs to main from forks and automated backport PRs in release branches.
# When this is called in a context that isn't a PR to main we pull in the scripts from main to execute them.
# This allows us to maintain a single set of workflows rather than having to maintain the workflows in every release branch.

on:
  pull_request:
  merge_group:
  workflow_call:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_OWNER: ${{ github.repository_owner }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Build Binaries
        id: build-binaries
        env:
          CROSS: 1
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" make build

  test:
    name: "Test"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Run make test
        id: run-make-test
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" make test

  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Lint Terraform
        id: lint-terraform
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" terraform

  actionlint:
    name: "Lint Workflows"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Action Lint
        id: action-lint
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" actionlint

  node-check:
    name: "Node Check"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Node Syntax Check
        id: node-syntax-check
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" node-check

  node-test:
    name: "Node Tests"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Node Unit Tests
        id: node-unit-tests
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" node-test

  eslint:
    name: "ESLint"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: ESLint Check
        id: eslint-check
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" eslint

  shellcheck:
    name: "Shellcheck"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Shell Check
        id: shell-check
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" shellcheck

  validate-commit-message:
    name: "Validate Commit Message"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Check Commit Message
        id: check-commit-message
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/validate-commit-message.js"

  gitleaks:
    name: "Scan for Secrets"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Check for Secrets
        id: check-for-secrets
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" node "$SCRIPT_DIR/lint.js" gitleaks
        continue-on-error: true

  sensitive-checks:
    name: "Sensitive Checks"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout CI Tools from main
        id: checkout-ci-tools
        if: github.base_ref != 'main' && github.event.merge_group.base_ref != 'refs/heads/main'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: rancher/terraform-provider-rancher2
          ref: "main"
          path: .github-tools
      - name: Test Check Sensitive
        id: test-check-sensitive
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" go test "$SCRIPT_DIR/check_sensitive.go" "$SCRIPT_DIR/check_sensitive_test.go"
      - name: Check Schema Sensitivity
        id: check-sensitive
        run: |
          if [ -d .github-tools/.github/workflows/scripts ]; then
            SCRIPT_DIR=".github-tools/.github/workflows/scripts"
          else
            SCRIPT_DIR=".github/workflows/scripts"
          fi
          "$SCRIPT_DIR/nix-run.sh" go run "$SCRIPT_DIR/check_sensitive.go"
